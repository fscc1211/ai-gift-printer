<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>AI Gift Printer LIVE</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,"Arial Rounded MT Bold",sans-serif;color:#8f416e}
body{background:#f6b4d1}.backdrop{position:fixed;inset:-40px;background:linear-gradient(#ef9ec488,#ffbed58c),url("printer-3d.png") center / cover;filter:blur(35px);z-index:-1}
.stage{position:absolute;width:min(100vw,calc(100dvh * 1.5));aspect-ratio:3/2;top:50%;left:50%;transform:translate(-50%,-50%);background:url("printer-3d.png") center / 100% 100% no-repeat;box-shadow:0 15px 60px #a4517880;overflow:hidden}
.paper{position:absolute;left:19%;top:37.3%;width:32.3%;height:44%;background:linear-gradient(100deg,#f4d6d3,#fff6f2 10%,#fff9f4 78%,#f1d3d0);clip-path:polygon(23% 0%,100% 0%,86% 100%,0% 96%);transform:rotate(1deg);filter:drop-shadow(4px 6px 3px #865a6666);padding:1.4% 3.8% 3.5% 6.5%;overflow:hidden}
.paper-scroll{height:100%;overflow-y:auto;scrollbar-width:none;transform:skewX(-6deg);padding:0 5% 3% 2%;text-align:center}.paper-scroll::-webkit-scrollbar{display:none}
.ticket{border:2px dashed #e7a1ba;border-radius:8px;padding:4% 2%;margin-bottom:5%;background:#fff8f4d9;box-shadow:0 4px 9px #ba839b33}.ticket.silver{background:linear-gradient(120deg,#fff,#dce0e7,#fff);border-color:#a7b1be}.ticket.gold{background:linear-gradient(120deg,#fff7d8,#eac76e,#fff4cf);border-color:#bba15d}
.ticket h3{font-size:clamp(7px,1.15vw,16px);color:#e180a6;letter-spacing:.5px;margin:0 0 4%}.ticket .avatar{font-size:clamp(18px,4vw,50px)}.ticket .username{font-size:clamp(10px,1.9vw,25px);font-weight:900;overflow-wrap:anywhere}.ticket .gift{display:flex;align-items:center;justify-content:center;gap:3%;font-size:clamp(8px,1.3vw,17px)}.ticket .gift img{width:12%;aspect-ratio:1;object-fit:contain}.ticket blockquote{margin:6% 0 0;border-top:2px dashed #eab1c7;padding:7% 0 0;font-size:clamp(9px,1.6vw,20px);line-height:1.25;color:#594458}
.sidebar{position:absolute;left:65.3%;top:10.5%;width:25.6%;height:78%;display:flex;flex-direction:column;gap:1.5%}.panel{background:#fff4f9f7;border:2px solid #f8c4d8;border-radius:14px;box-shadow:0 3px 12px #a85d8440;padding:2.5%;overflow:hidden}.panel h2{text-align:center;color:#c34482;font-size:clamp(10px,1.6vw,21px);margin:0 0 2.5%}.gifts{height:35%}.gift-row{height:28%;display:flex;align-items:center;gap:3%;background:#fff9fc;border-radius:8px;margin:1.2% 0;padding:1.5%;font-weight:800;font-size:clamp(8px,1.25vw,16px)}.gift-row img{height:100%;aspect-ratio:1;object-fit:contain;border-radius:6px}.gift-row small{display:block;font-size:.78em;color:#b76b93}
.leaders{flex:1;min-height:0;display:flex;flex-direction:column}.ranking{flex:1;min-height:0;overflow-y:auto}.rank{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f4d8e4;padding:1.6% 1%;gap:4px;font-size:clamp(8px,1.18vw,16px)}.rank span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.rank strong{white-space:nowrap;color:#b94f83}
.status{position:absolute;left:19%;top:84%;width:37%;height:6%;background:#fff5f9ed;border-radius:40px;border:2px solid #f6c3d7;text-align:center;display:flex;align-items:center;justify-content:center;color:#c04e87;font-weight:900;font-size:clamp(9px,1.3vw,18px);box-shadow:0 4px 10px #a8577940}
.note{position:fixed;bottom:3%;left:0;right:0;text-align:center;font-size:clamp(11px,2.7vw,16px);color:white;text-shadow:0 1px 5px #6b3049}
@media(max-aspect-ratio:3/2){.stage{width:100vw}.note{display:block}}
</style></head><body><div class="backdrop"></div><main class="stage" aria-label="Live gift printer">
<div class="paper"><div class="paper-scroll" id="paper"><article class="ticket" id="welcome"><h3>♡ A MESSAGE FOR YOU ♡</h3><div class="avatar">💌</div><div class="username">Welcome!</div><blockquote>Your happy message is coming soon.</blockquote></article></div></div>
<aside class="sidebar"><section class="panel gifts"><h2>🎁 GIFTS & PAPER</h2><div class="gift-row"><img src="rose.jpg" alt="Rose"><span>Rose<small>🤍 White paper</small></span></div><div class="gift-row"><img src="donut.jpg" alt="Donut"><span>Donut<small>🩶 Silver paper</small></span></div><div class="gift-row"><img src="legendary.jpg" alt="Hand Heart"><span>Hand Heart<small>💛 Gold paper</small></span></div></section>
<section class="panel leaders"><h2>🏆 TOP 10 SENDERS</h2><div class="ranking" id="ranking">Waiting for gifts...</div></section></aside>
<div class="status" id="status">♡ CONNECTING...</div></main><div class="note">💗 AI Gift Printer · LIVE</div>
<script src="shared.js"></script><script>
let last=0,loading=false,rankingLoading=false,printed=0;const seen=new Set(),paper=document.getElementById('paper'),statusEl=document.getElementById('status');
function render(item){if(!item||!item.uid||seen.has(item.uid))return;
if(item.type==='reset'){seen.clear();paper.replaceChildren();printed=0;statusEl.textContent='♡ READY FOR GIFTS';return}
seen.add(item.uid);document.getElementById('welcome')?.remove();
const meta=GIFT_TYPES[normalizeGift(item.gift)]||GIFT_TYPES.rose;
const el=document.createElement('article');el.className='ticket '+meta.paper;
const title=document.createElement('h3');title.textContent='♡ A MESSAGE FOR YOU ♡';
const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=item.avatar||'🐶';
const name=document.createElement('div');name.className='username';name.textContent='@'+String(item.name||'friend');
const gift=document.createElement('div');gift.className='gift';const img=document.createElement('img');img.src=meta.image;img.alt=meta.label;const giftName=document.createElement('span');giftName.textContent='Sent '+meta.label;gift.append(img,giftName);
const quote=document.createElement('blockquote');quote.textContent='“'+String(item.quote||'You are amazing!')+'”';el.append(title,avatar,name,gift,quote);paper.prepend(el);
while(paper.children.length>60)paper.lastElementChild.remove();paper.scrollTop=0;printed++;statusEl.textContent='💗 PRINTED '+printed+' MESSAGE'+(printed===1?'':'S')}
async function refreshRanking(){if(rankingLoading)return;rankingLoading=true;try{const list=leaderboard(await fetchRecent(1000)),box=document.getElementById('ranking');box.replaceChildren();if(!list.length){box.textContent='Waiting for gifts...';return}list.forEach((entry,i)=>{const line=document.createElement('div');line.className='rank';const name=document.createElement('span');name.textContent=(['🥇','🥈','🥉'][i]||(i+1)+'.')+' @'+entry.name;const count=document.createElement('strong');count.textContent=entry.count+'×';line.append(name,count);box.append(line)})}catch(e){document.getElementById('ranking').textContent='Connection error'}finally{rankingLoading=false}}
async function poll(){if(loading)return;loading=true;try{const rows=await fetchPrints(last);for(const row of rows){last=Math.max(last,Number(row.id));render(row.payload)}if(rows.length)await refreshRanking();if(!printed)statusEl.textContent='♡ READY FOR GIFTS'}catch(e){statusEl.textContent='⚠ CONNECTION ERROR'}finally{loading=false}}
async function start(){try{const rows=(await fetchRecent(1000)).reverse();for(const row of rows){last=Math.max(last,Number(row.id));render(row.payload)}if(!printed)statusEl.textContent='♡ READY FOR GIFTS'}catch(e){statusEl.textContent='⚠ CONNECTION ERROR'}await refreshRanking();setInterval(poll,1200);setInterval(refreshRanking,12000)}start();
</script></body></html>
