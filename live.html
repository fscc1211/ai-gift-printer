<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>LIVE | Good Vibes Printer</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:ui-rounded,system-ui,-apple-system,sans-serif}.scene{position:relative;width:100%;height:100dvh;overflow:hidden;background:radial-gradient(circle at 75% 19%,#fff8d5 0 7%,transparent 24%),linear-gradient(#ffcfb9 0%,#ffb4c6 35%,#c5b5dc 60%,#a3bfc3 100%);isolation:isolate}.sun{position:absolute;width:25vmin;height:25vmin;border-radius:50%;background:#fff2bc;box-shadow:0 0 75px 38px #fff1c180;top:17%;right:8%}.sea{position:absolute;inset:58% 0 0;background:linear-gradient(#83c3d2,#719bb4 43%,#f4bba9 44%,#b77b8b)}.sea:before{content:'';position:absolute;top:9%;width:100%;height:15%;background:repeating-linear-gradient(0deg,transparent 0 12px,#fff9 13px 14px);opacity:.35}.wall{position:absolute;inset:0 0 34%;border-left:12px solid #fff0d9aa;border-right:12px solid #fff0d9aa;pointer-events:none}.flower{position:absolute;bottom:20%;font-size:clamp(26px,7vw,55px);filter:drop-shadow(0 6px 5px #55354a55)}.f1{left:2%}.f2{right:1%;bottom:24%}.header{position:absolute;top:3.3%;left:4%;right:4%;text-align:center;color:#714460;text-shadow:0 2px #fff9}.header h1{font-size:clamp(20px,5.8vw,35px);margin:0;letter-spacing:2px;font-weight:1000}.header p{margin:3px;font-size:clamp(10px,2.8vw,15px);letter-spacing:2px;font-weight:800}.spark{position:absolute;font-size:28px;opacity:.85;animation:float 5s ease-in-out infinite}.s1{left:9%;top:20%}.s2{right:9%;top:35%;animation-delay:-2s}.s3{left:12%;top:44%;animation-delay:-3s}.dog{position:absolute;top:23%;left:50%;transform:translateX(-50%);width:min(52vw,260px);height:min(47vw,235px);z-index:2;filter:drop-shadow(0 13px 12px #69425c66);animation:bob 2.3s ease-in-out infinite}.ear{position:absolute;top:15%;width:33%;height:63%;background:linear-gradient(120deg,#a96331,#d58d46 55%,#aa622d);border-radius:65% 55% 60% 65%;z-index:0}.ear.left{left:0;transform:rotate(14deg)}.ear.right{right:0;transform:rotate(-14deg)}.head{position:absolute;inset:0 12% 13%;background:radial-gradient(circle at 45% 35%,#ffde8d,#e8ad57 65%,#bd763c);border-radius:49% 49% 45% 45%;border:3px solid #c88748;z-index:1}.muzzle{position:absolute;left:29%;right:29%;top:54%;height:27%;background:#fff1ca;border-radius:48%;z-index:3}.nose{position:absolute;left:43%;top:53%;width:14%;height:10%;background:#49353c;border-radius:48%;z-index:4}.smile{position:absolute;left:42%;top:63%;width:16%;height:12%;border-bottom:3px solid #75453c;border-radius:50%;z-index:4}.glasses{position:absolute;left:19%;right:19%;top:32%;height:30%;display:flex;gap:5%;z-index:5}.lens{flex:1;border:clamp(4px,1.1vw,7px) solid #2b2731;border-radius:50%;background:#fff8e61c;position:relative}.lens:after{content:'';position:absolute;width:23%;height:26%;background:#2e242c;border-radius:50%;left:40%;top:39%}.bridge{position:absolute;left:46%;top:25%;width:8%;border-top:6px solid #2b2731}.paw{position:absolute;bottom:-8%;width:31%;height:24%;background:linear-gradient(#e9ae63,#c77b42);border-radius:45%;z-index:8;animation:type .42s ease-in-out infinite alternate}.paw.left{left:16%}.paw.right{right:16%;animation-delay:-.42s}.printer{position:absolute;top:48%;left:50%;transform:translateX(-50%);width:min(83vw,430px);height:min(31vw,150px);background:linear-gradient(160deg,#ffb7d2,#f17ca9 60%,#cc528c);border-radius:26px 26px 20px 20px;border:3px solid #ffd9e7;box-shadow:0 14px 0 #a74475,0 25px 34px #55324b77;z-index:4}.printer:before{content:'';position:absolute;inset:9% 7% auto;height:15%;border-radius:50%;background:#fff9;opacity:.65}.brand{position:absolute;left:0;right:0;top:34%;font-size:clamp(12px,3vw,19px);text-align:center;color:#fff9;font-weight:1000;letter-spacing:3px;text-shadow:0 2px #a34774}.slot{position:absolute;left:10%;right:10%;bottom:11%;height:13%;border-radius:20px;background:#7b3559;box-shadow:inset 0 3px 6px #421c3d}.led{position:absolute;right:7%;top:28%;width:11px;height:11px;background:#caffbb;border-radius:50%;box-shadow:0 0 12px #d0ffb9}.paper-wrap{position:absolute;top:59%;bottom:-2%;left:50%;transform:translateX(-50%);width:min(67vw,345px);z-index:3;filter:drop-shadow(0 9px 9px #56334460);overflow:hidden;border-radius:0 0 8px 8px}.paper{height:100%;background:repeating-linear-gradient(180deg,#fffef9 0,#fffef9 26px,#fff8f5 27px,#fff8f5 28px);border-left:2px solid #e7d5d4;border-right:2px solid #e7d5d4;padding:17px 11px 40px;overflow:hidden;display:flex;flex-direction:column;gap:11px;align-items:stretch}.ticket{background:#fff;border:2px dashed #f2b9cc;border-radius:12px;text-align:center;padding:12px 8px;color:#8c5170;animation:printin .9s ease-out both;box-shadow:0 4px 12px #d8afbf33}.ticket .avatar{font-size:clamp(28px,8vw,48px);line-height:1.2}.ticket b{display:block;font-size:clamp(13px,3.7vw,20px);color:#a33f7a;overflow-wrap:anywhere}.ticket .gift{font-size:clamp(10px,2.8vw,15px);margin:3px 0}.ticket p{font-size:clamp(11px,2.9vw,16px);font-weight:650;line-height:1.3;margin:7px 0}.ticket small{font-size:10px;color:#b8899f}.waiting{margin-top:12px}.status{position:absolute;top:13%;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:50px;background:#fff9;color:#a64b7c;padding:9px 15px;z-index:5;font-size:clamp(11px,2.9vw,15px);font-weight:900;box-shadow:0 5px 18px #9a5a7a30}.bottom{position:absolute;bottom:1%;right:3%;font-size:10px;color:#fff9;z-index:6}.hide{display:none}@keyframes bob{50%{transform:translateX(-50%) translateY(-6px)}}@keyframes type{to{transform:translateY(10px) rotate(5deg)}}@keyframes float{50%{transform:translateY(-18px) rotate(8deg)}}@keyframes printin{from{opacity:0;transform:translateY(-50px) scaleY(.65)}to{opacity:1;transform:translateY(0) scaleY(1)}}@media(min-aspect-ratio:3/4){.dog{top:20%;width:min(34vh,220px);height:min(30vh,195px)}.printer{top:47%;width:min(60vh,400px);height:min(19vh,125px)}.paper-wrap{top:60%;width:min(48vh,320px)}}@media(prefers-reduced-motion:reduce){.dog,.paw,.spark,.ticket{animation:none}}</style></head><body><main class="scene"><div class="sun"></div><div class="sea"></div><div class="wall"></div><div class="flower f1">🌺🌿</div><div class="flower f2">🌷🌼</div><div class="spark s1">💗</div><div class="spark s2">✨</div><div class="spark s3">💝</div><div class="header"><h1>GOOD VIBES PRINTER</h1><p>♡ A LITTLE JOY FOR YOU ♡</p></div><div class="status" id="status">♡ Connecting to printer...</div><div class="dog" aria-label="Golden puppy with round black glasses typing"><div class="ear left"></div><div class="ear right"></div><div class="head"></div><div class="muzzle"></div><div class="nose"></div><div class="smile"></div><div class="glasses"><div class="lens"></div><div class="lens"></div><div class="bridge"></div></div><div class="paw left"></div><div class="paw right"></div></div><div class="printer"><div class="brand">♡ PUPPY PRINT ♡</div><div class="led"></div><div class="slot"></div></div><div class="paper-wrap"><div class="paper" id="paper"><div class="ticket waiting" id="welcome"><div class="avatar">💌</div><b>Welcome, lovely!</b><p>Your happy message is on its way...</p><small>♡ Made with love ♡</small></div></div></div><div class="bottom">LIVE · GOOD VIBES ONLY</div></main><script src="shared.js"></script><script>let last=0,count=0,busy=false;const seen=new Set(),paper=document.getElementById('paper'),statusEl=document.getElementById('status');function add(item){if(!item||!item.uid||seen.has(item.uid))return;seen.add(item.uid);document.getElementById('welcome')?.remove();const t=document.createElement('article');t.className='ticket';const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=item.avatar||'🐶';const name=document.createElement('b');name.textContent='@'+String(item.name||'friend');const gift=document.createElement('div');gift.className='gift';gift.textContent='SENT '+String(item.gift||'🎁');const quote=document.createElement('p');quote.textContent='“'+String(item.quote||'You are amazing!')+'”';const footer=document.createElement('small');footer.textContent='♡ THANK YOU FOR BEING HERE ♡';t.append(avatar,name,gift,quote,footer);paper.prepend(t);while(paper.children.length>8)paper.lastElementChild.remove();statusEl.textContent='🖨️ '+(++count)+' HAPPY MESSAGE'+(count>1?'S':'')+' PRINTED';}async function poll(){if(busy)return;busy=true;try{const rows=await fetchPrints(last);for(const row of rows){last=Math.max(last,Number(row.id));add(row.payload)}if(!count)statusEl.textContent='♡ READY FOR YOUR GIFTS';}catch(e){statusEl.textContent='⚠️ CONNECTION ERROR · RELOAD'}finally{busy=false}}async function start(){try{const rows=await fetchPrints(0);last=rows.length?Number(rows[rows.length-1].id):0;statusEl.textContent='♡ READY FOR YOUR GIFTS'}catch(e){statusEl.textContent='⚠️ CONNECTION ERROR · RELOAD'}setInterval(poll,1200)}start();</script></body></html>
