<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIVE — Gift Printer</title><link rel="stylesheet" href="style.css"></head><body><main class="stage"><div class="back"></div><div class="header"><h1>🐶 GOOD VIBES PRINTER</h1><small>A LITTLE MESSAGE FOR YOU ♡</small></div><div class="badge" id="status">♡ Waiting for gifts</div><div class="printer"><div class="slot"></div><div class="light"></div></div><div class="paper-window"><div class="paper" id="paper"><div class="ticket" id="intro"><div class="avatar">💌</div><b>Welcome to our happy place!</b><p>Send a gift for a little encouragement ♡</p></div></div></div></main><script src="shared.js"></script><script>const qs=new URLSearchParams(location.search);if(qs.has('room'))CONFIG.room=qs.get('room');let last=0,total=0;const seen=new Set();function receive(item){if(!item||seen.has(item.uid))return;seen.add(item.uid);const t=document.createElement('div');t.className='ticket';for(const [tag,cls,val] of [['div','avatar',item.avatar],['b','', '@'+item.name],['div','gift','Sent '+item.gift],['p','', '“'+item.quote+'”'],['div','footer','♡ Thank you for being here ♡']]){const el=document.createElement(tag);if(cls)el.className=cls;el.textContent=val;t.append(el)}document.getElementById('intro')?.remove();document.getElementById('paper').prepend(t);if(document.getElementById('paper').children.length>15)document.getElementById('paper').lastElementChild.remove();document.getElementById('status').textContent='🖨 Printed '+(++total)+' messages'}channel.onmessage=e=>receive(e.data);async function poll(){try{const rows=await cloudFetch(last);for(const row of rows){last=Math.max(last,row.id);receive(row.payload)}}catch(e){document.getElementById('status').textContent='⚠ Cloud connection error'}}if(CONFIG.url&&CONFIG.key){(async()=>{try{const rows=await cloudFetch(0);last=rows.length?rows[rows.length-1].id:0}catch(e){}setInterval(poll,1400)})()}</script></body></html>
